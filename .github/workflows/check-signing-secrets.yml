name: Check signing secret presence

on:
  push:
    branches: [ops/recover-vibecheck-signing]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate signing secrets
        shell: bash
        env:
          VIBECHECK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.VIBECHECK_UPLOAD_KEYSTORE_BASE64 }}
          VIBECHECK_KEYSTORE_BASE64: ${{ secrets.VIBECHECK_KEYSTORE_BASE64 }}
          VIBECHECK_UPLOAD_JKS_BASE64: ${{ secrets.VIBECHECK_UPLOAD_JKS_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          VIBECHECK_KEYSTORE_PASSWORD: ${{ secrets.VIBECHECK_KEYSTORE_PASSWORD }}
          VIBECHECK_STOREPASS: ${{ secrets.VIBECHECK_STOREPASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          VIBECHECK_KEY_ALIAS: ${{ secrets.VIBECHECK_KEY_ALIAS }}
          VIBECHECK_ALIAS: ${{ secrets.VIBECHECK_ALIAS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          VIBECHECK_KEY_PASSWORD: ${{ secrets.VIBECHECK_KEY_PASSWORD }}
          VIBECHECK_KEYPASS: ${{ secrets.VIBECHECK_KEYPASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in             VIBECHECK_UPLOAD_KEYSTORE_BASE64 VIBECHECK_KEYSTORE_BASE64 VIBECHECK_UPLOAD_JKS_BASE64             KEYSTORE_BASE64 UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_BASE64 SIGNING_KEY             VIBECHECK_KEYSTORE_PASSWORD VIBECHECK_STOREPASS KEYSTORE_PASSWORD STORE_PASSWORD             UPLOAD_STORE_PASSWORD SIGNING_STORE_PASSWORD             VIBECHECK_KEY_ALIAS VIBECHECK_ALIAS KEY_ALIAS UPLOAD_KEY_ALIAS SIGNING_KEY_ALIAS             VIBECHECK_KEY_PASSWORD VIBECHECK_KEYPASS KEY_PASSWORD UPLOAD_KEY_PASSWORD SIGNING_KEY_PASSWORD
          do
            if [ -n "${!name}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done
