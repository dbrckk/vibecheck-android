name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Release lint
        run: gradle :app:lintRelease --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
