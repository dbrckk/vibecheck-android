name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Release lint
        run: gradle :app:lintRelease --stacktrace
      - name: Audit release SDKs
        shell: bash
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath > release-dependencies.txt
          if grep -Eiq 'play-services-ads|firebase-analytics|com\.android\.billingclient:billing' release-dependencies.txt; then
            echo "Forbidden ads, analytics, or billing SDK detected in releaseRuntimeClasspath"
            grep -Ei 'play-services-ads|firebase-analytics|com\.android\.billingclient:billing' release-dependencies.txt || true
            exit 1
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Audit release bundle native code
        shell: bash
        run: |
          if unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -Eq '(^|/)lib/.*\.so      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
; then
            echo "Unexpected native library detected. Review 16 KB page-size compatibility before release."
            unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -E '(^|/)lib/.*\.so      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
 || true
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: vibecheck-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
